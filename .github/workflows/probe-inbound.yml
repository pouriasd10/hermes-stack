name: 🌐 Probe inbound
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the box
        run: |
          echo "=== attempt 1: /probe.txt ==="
          curl -fsS --max-time 20 http://152.55.184.222:8765/probe.txt && echo "" || echo "FAILED-1 (blocked or wrong path)"
          echo "=== attempt 2: /8765/probe.txt ==="
          curl -fsS --max-time 20 http://152.55.184.222:8765/8765/probe.txt && echo "" || echo "FAILED-2"
          echo "=== attempt 3: plain TCP connect 8642 (known listening port) ==="
          timeout 10 bash -c 'echo > /dev/tcp/152.55.184.222/8642' && echo "PORT-8642-OPEN" || echo "PORT-8642-CLOSED"
          echo "=== attempt 4: TCP connect 8765 ==="
          timeout 10 bash -c 'echo > /dev/tcp/152.55.184.222/8765' && echo "PORT-8765-OPEN" || echo "PORT-8765-CLOSED"
